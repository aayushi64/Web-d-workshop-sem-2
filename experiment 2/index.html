<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Electronics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TechStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200?text=Laptop" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Laptop</h5>
                        <p class="card-text text-muted">High performance laptop</p>
                        <p class="h5">₹50,000 <span class="badge badge-new fs-6">New</span></p>
                        <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#productModal" onclick="updateModal('Laptop', 'High performance laptop with advanced features.', '₹50,000')">View Details</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200?text=Smartphone" class="card-img-top" alt="Mobile">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Mobile</h5>
                        <p class="card-text text-muted">Latest smartphone</p>
                        <p class="h5">₹30,000 <span class="badge badge-sale fs-6">Sale</span></p>
                        <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#productModal" onclick="updateModal('Mobile', 'Latest flagship smartphone with pro camera.', '₹30,000')">View Details</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200?text=Headphones" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Headphones</h5>
                        <p class="card-text text-muted">Noise cancelling</p>
                        <p class="h5">₹5,000 <span class="badge badge-new fs-6">New</span></p>
                        <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#productModal" onclick="updateModal('Headphones', 'Premium noise cancelling headphones.', '₹5,000')">View Details</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Product Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modalDesc"></p>
                    <p class="fw-bold text-primary" id="modalPrice"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 TechStore | Follow us on social media</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateModal(title, desc, price) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalPrice').innerText = "Price: " + price;
        }
    </script>
</body>
</html>
